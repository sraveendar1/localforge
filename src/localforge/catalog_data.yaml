# Curated catalog of open-weight models, tagged by task/modality and hardware needs.
# disk_gb: download size, checked against Ollama's registry (2026-09-23).
# kv_gb_per_8k: context (KV) cache per 8k tokens of context, fp16, from each
#   model's architecture (layers x KV heads x head size x 2 x 2 bytes);
#   gemma3's sliding-window layers make its cache small.
# active_gb: weights read per generated token, for mixture-of-experts models.
# min_ram_gb: a quick floor only -- catalog.py decides fit from memory while
#   running (weights + context cache + overhead) against what the machine
#   can spare, and prefers models fast enough to be comfortable.
# min_vram_gb: 0 for text models -- any of them can run on the CPU.
# runtime: which backend in localforge/backends/ knows how to serve this model.
#
# Left out on purpose: "thinking" models (qwen3, qwen3.5, gpt-oss) -- their
# reasoning text can end up inside a generated file -- and cloud-only tags
# such as kimi-k2 (0 bytes to download; it never ran locally).

models:
  # --- coding ---
  - name: qwen3-coder:30b  # mixture-of-experts: ~3B active, so fast for its size
    modality: coding
    runtime: ollama
    min_vram_gb: 0
    min_ram_gb: 24
    disk_gb: 18.6
    kv_gb_per_8k: 0.8
    active_gb: 2.0
    quality_tier: 4

  - name: devstral-small-2:24b
    modality: coding
    runtime: ollama
    min_vram_gb: 0
    min_ram_gb: 24
