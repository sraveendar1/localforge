  # --- judge (checks another local model's output; never exposed as a
  # delegate tool -- see tools.Dispatcher.judge(), resolved separately from
  # TASK_MODALITIES so the frontier model can never delegate work to it by
  # mistake). Deliberately a single dedicated model, not a tier list: the
  # point is a model actually trained to evaluate, not a stand-in.
  - name: atla/selene-mini
    modality: judge
    runtime: ollama
    min_vram_gb: 0
